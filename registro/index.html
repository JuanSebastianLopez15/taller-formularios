<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <form id="registro" action="https://jsonplaceholder.typicode.com/posts"
  method="post" novalidate> <!--Novalidate no muestra la notificacion de errores  -->
    <label for="nombre">Nombre completo</label>
    <input id="nombre" name="nombre" type="text"
           required minlength="3" maxlength="60" autocomplete="name"
           aria-describedby="nombre-error">
    <p id="nombre-error" class="error" aria-live="polite"></p>

    <label for="email">Correo</label>
    <input id="email" name="email" type="email" required autocomplete="email"
           aria-describedby="email-error">
    <p id="email-error" class="error" aria-live="polite"></p>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password"
           required minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
           aria-describedby="password-ayuda password-error">
    <p id="password-ayuda" class="ayuda">Mínimo 8 caracteres, con al menos una letra y un número.</p>
    <p id="password-error" class="error" aria-live="polite"></p>

    <label for="confirmar">Confirmar contraseña</label>
    <input id="confirmar" name="confirmar" type="password" required
           aria-describedby="confirmar-error">
    <p id="confirmar-error" class="error" aria-live="polite"></p>

    <label for="edad">Edad</label>
    <input id="edad" name="edad" type="number"
           required min="18" max="120" step="1"
           aria-describedby="edad-error">
    <p id="edad-error" class="error" aria-live="polite"></p>

    <label for="pais">País</label>
    <select id="pais" name="pais" required aria-describedby="pais-error">
      <option value="">Elige un país</option>
      <option value="Colombia">Colombia</option>
      <option value="España">España</option>
      <option value="México">México</option>
      <option value="Argentina">Argentina</option>
    </select>
    <p id="pais-error" class="error" aria-live="polite"></p>

    <label for="terminos">Acepto términos</label>
    <input id="terminos" name="terminos" type="checkbox" required
           aria-describedby="terminos-error">
    <p id="terminos-error" class="error" aria-live="polite"></p>

    <fieldset>
      <legend>Teléfonos (opcional, máximo 3)</legend>
      <div id="telefonos"></div>
      <button type="button" id="agregar-telefono">Agregar teléfono</button>
    </fieldset>

    <button type="submit">Crear cuenta</button>
    <p id="mensaje" role="status"></p>
    <p id="saludo"></p>
  </form>
  <script type="module" src="app.js"></script>
</body>
</html>
